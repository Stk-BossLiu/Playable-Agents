<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>选卡试玩</title>
<style>body{font:20px system-ui;background:#152737;color:white;text-align:center;margin:20vh auto}button{font:inherit;padding:1em;color:#132529;background:#8de1bf;border:0;border-radius:8px}</style>
<main><img alt="" width="32" height="32" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle fill='gold' cx='16' cy='16' r='13'/%3E%3C/svg%3E"><h1 id="phase">选择升级卡</h1><button id="action">攻击 +1</button></main>
<script>
const phase = document.querySelector('#phase');
const action = document.querySelector('#action');
let wave = 0;
function gameEnd() { phase.textContent = '挑战完成'; action.textContent = '再玩一次'; }
action.addEventListener('click', () => {
  wave = (wave + 1) % 3;
  if (wave === 1) { phase.textContent = '进入第二波'; action.textContent = '完成挑战'; }
  else if (wave === 2) gameEnd();
  else { phase.textContent = '选择升级卡'; action.textContent = '攻击 +1'; }
});
</script></html>
